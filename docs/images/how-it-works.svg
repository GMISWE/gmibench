<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">How the benchmark works</title>
  <desc id="d">Suites and models feed the runner. The runner writes raw results with a task hash, manifest ID and price. Scoring, under a released standard, keeps only current results and produces scorecards and tiers.</desc>
  <style>
    :root { --bg:#ffffff; --card:#f6f8fa; --line:#d0d7de; --ink:#1f2328; --ink2:#59636e;
            --blue:#2a78d6; --blue-soft:#ddeafb; --orange:#eb6834; --orange-soft:#fde4d9; --arrow:#8c959f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --ink:#e6edf3; --ink2:#9198a1;
              --blue:#3987e5; --blue-soft:#12253f; --orange:#d95926; --orange-soft:#3a1d10; --arrow:#6e7681; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .card-blue { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .card-orange { fill: var(--orange-soft); stroke: var(--orange); stroke-width: 2; }
    .ink { fill: var(--ink); } .ink2 { fill: var(--ink2); } .blue { fill: var(--blue); } .orange { fill: var(--orange); }
    .arrow { stroke: var(--arrow); stroke-width: 2; fill: none; }
    .head { fill: var(--arrow); }
    .step { fill: var(--blue); } .step-o { fill: var(--orange); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 18px; font-weight: 700; } .s { font-size: 14px; } .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="470" rx="16"/>

  <!-- Inputs -->
  <rect class="card" x="20" y="40" width="200" height="120" rx="12"/>
  <text class="ink h" x="40" y="74">Suites</text>
  <text class="ink2 m" x="40" y="100">suites/&lt;name&gt;/</text>
  <text class="ink2 s" x="40" y="124">tasks + content hash,</text>
  <text class="ink2 s" x="40" y="144">a version each</text>

  <rect class="card" x="20" y="260" width="200" height="120" rx="12"/>
  <text class="ink h" x="40" y="294">Models</text>
  <text class="ink2 m" x="40" y="320">models.yaml</text>
  <text class="ink2 s" x="40" y="344">served on the</text>
  <text class="ink2 s" x="40" y="364">GMI Cloud API</text>

  <!-- Pipeline -->
  <rect class="card" x="260" y="150" width="200" height="120" rx="12"/>
  <text class="ink h" x="280" y="184">Runner</text>
  <text class="ink2 s" x="280" y="210">3 runs per task, temp 0</text>
  <text class="ink2 s" x="280" y="232">streaming, retries,</text>
  <text class="ink2 s" x="280" y="252">tool loop, resume</text>

  <rect class="card" x="500" y="150" width="200" height="120" rx="12"/>
  <text class="ink h" x="520" y="184">Raw results</text>
  <text class="ink2 s" x="520" y="210">one line per run, with</text>
  <text class="ink2 s" x="520" y="232">task hash, manifest ID</text>
  <text class="ink2 s" x="520" y="252">and the price paid</text>

  <rect class="card-blue" x="740" y="150" width="200" height="120" rx="12"/>
  <text class="ink h" x="760" y="184">Scoring</text>
  <text class="ink2 s" x="760" y="210">only results for the</text>
  <text class="ink2 s" x="760" y="232">current tasks count;</text>
  <text class="ink2 s" x="760" y="252">5 dimensions</text>

  <rect class="card" x="980" y="150" width="200" height="120" rx="12"/>
  <text class="ink h" x="1000" y="184">Scorecards</text>
  <text class="ink2 s" x="1000" y="210">Completed</text>
  <text class="ink2 s" x="1000" y="232">→ Meets production bar</text>
  <text class="ink2 s" x="1000" y="252">→ Best value in class</text>

  <!-- Standard -->
  <rect class="card-orange" x="740" y="330" width="200" height="104" rx="12"/>
  <text class="ink h" x="760" y="364">Standard v1.0</text>
  <text class="ink2 s" x="760" y="390">which suites count,</text>
  <text class="ink2 s" x="760" y="412">their versions, tier rules</text>

  <!-- Arrows -->
  <path class="arrow" d="M220,100 H240 Q250,100 250,110 V200 Q250,210 258,210" marker-end="url(#a)"/>
  <path class="arrow" d="M220,320 H240 Q250,320 250,310 V220 Q250,210 258,210" marker-end="url(#a)"/>
  <path class="arrow" d="M460,210 H498" marker-end="url(#a)"/>
  <path class="arrow" d="M700,210 H738" marker-end="url(#a)"/>
  <path class="arrow" d="M940,210 H978" marker-end="url(#a)"/>
  <path class="arrow" d="M840,330 V272" marker-end="url(#a)"/>

  <!-- Step numbers -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle class="step" cx="260" cy="150" r="13"/><text x="260" y="155">1</text>
    <circle class="step" cx="500" cy="150" r="13"/><text x="500" y="155">2</text>
    <circle class="step" cx="740" cy="150" r="13"/><text x="740" y="155">3</text>
    <circle class="step" cx="980" cy="150" r="13"/><text x="980" y="155">4</text>
  </g>

  <text class="ink2 s" x="20" y="452">1 run · 2 record · 3 score under a released standard · 4 publish</text>
  <text class="ink2 m" x="1180" y="452" text-anchor="end">python bench.py run → score → report</text>
</svg>
