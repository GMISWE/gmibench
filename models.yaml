# Cohort for the GMI Open Model Standard benchmark.
#
# Field sources (checked 2026-11-05):
#   context_length, precision, input/output price  -> GMI `GET /v1/models` (served values)
#   license, total_params_b, weights_url, vision   -> Hugging Face model API
#   active_params_b                                -> the "A<n>B" suffix in the model name / model card
# Unknown values are `null`. The CLI prints a warning for each one.
#
# `name` is the short alias used on the CLI (--models gpt-oss-120b).
# `vision: true` means the model runs the documents task set. Others get `n/a`.
# Prices are GMI list prices in USD per 1M tokens (before any account discount).

models:
  - name: gemma-4-26b-a4b
    id: google/gemma-4-26b-a4b-it
    focus: general, tool use
    lab: Google
    total_params_b: 25.8   # safetensors total (the model card says 25.2B)
    active_params_b: 3.8   # model card
    license: apache-2.0
    context_length: 256000
    precision: FP8
    input_price_per_m: 0.13
    output_price_per_m: 0.40
    vision: false  # GMI returned 400 for image input (probe 2026-11-05)
    weights_url: https://huggingface.co/google/gemma-4-26B-A4B-it

  - name: glm-5.3-flash
    id: zai-org/GLM-5.3-Flash
    focus: coding agent
    lab: Zhipu AI (Z.ai)
    total_params_b: 321.3  # safetensors total (the model card says 320B)
    active_params_b: 18    # model card
    license: mit
    context_length: 1048576
    precision: FP8
    input_price_per_m: 0.15
    output_price_per_m: 0.50
    vision: true  # image input accepted on GMI (probe 2026-11-05)
    weights_url: https://huggingface.co/zai-org/GLM-5.3-Flash

  - name: deepseek-v4-flash
    id: deepseek-ai/DeepSeek-V4-Flash
    focus: coding, reasoning
    lab: DeepSeek
    total_params_b: 290.9  # safetensors total (the model card says 284B)
    active_params_b: 13    # model card
    license: mit
    context_length: 1048575
    precision: FP8
    input_price_per_m: 0.14
    output_price_per_m: 0.28
    vision: false  # GMI: image_url not supported for this model
    weights_url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash

  - name: qwen3.6-35b-a3b
    id: Qwen/Qwen3.6-35B-A3B
    focus: tool use
    lab: Alibaba Qwen
    total_params_b: 36.0
    active_params_b: 3
    license: apache-2.0
    context_length: 262144
    precision: FP8
    input_price_per_m: 0.248
    output_price_per_m: 1.485
    vision: true  # image input accepted on GMI (probe 2026-11-05)
    weights_url: https://huggingface.co/Qwen/Qwen3.6-35B-A3B

  # Three planned models (NVIDIA Nemotron 3.5 Super-VL, Nemotron 3.5 Lightning, gpt-oss-120b)
  # were not available on GMI during the test window and were not evaluated.

  - name: qwen3.5-122b-a10b
    id: Qwen/Qwen3.5-122B-A10B
    focus: vision, documents, agents
    lab: Alibaba Qwen
    total_params_b: 125.1
