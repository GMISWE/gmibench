    license: apache-2.0
    context_length: 262144
    precision: FP8
    input_price_per_m: 0.40
    output_price_per_m: 3.20
    vision: true  # image input accepted on GMI (probe 2026-11-06)
    weights_url: https://huggingface.co/Qwen/Qwen3.5-122B-A10B

  - name: qwen3.5-27b
    id: Qwen/Qwen3.5-27B
