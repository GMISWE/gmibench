[project]
name = "gmibench"
version = "0.1.0"
description = "GMI Open Model Standard: reproducible benchmark for open-weight models served on GMI Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "pillow>=10.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gmibench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
