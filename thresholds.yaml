# Tunable thresholds for the GMI Open Model Standard tiers and checks.

tiers:
  verified:
    max_error_rate: 0.02          # share of runs that ended in an unrecovered API error
  production_ready:
    min_pass_rate: 70             # percent, across all applicable task sets
    min_consistency: 80           # percent of tasks that passed in every run
    max_ttft_median_s: 1.5        # median time to first streamed token, seconds
  recommended:
    # Production Ready + lowest cost per successful task in a workload (task set)
    # among Production Ready models of the same size class.
    compare_within: production_ready

# Size classes use total parameters in billions. Upper bounds are inclusive.
size_classes:
  basis: total_params_b
  classes:
    - {name: small, max_b: 40}
    - {name: mid, max_b: 150}
    - {name: large, max_b: null}

deployability:
  min_context_tokens: 128000
  # OSI-approved licenses (SPDX ids, lower case) plus OpenMDW.
  allowed_licenses:
    - apache-2.0
    - mit
    - bsd-2-clause
    - bsd-3-clause
    - mpl-2.0
    - isc
    - gpl-2.0
    - gpl-3.0
    - lgpl-2.1
    - lgpl-3.0
    - agpl-3.0
    - upl-1.0
    - openmdw-1.0
    - openmdw-1.1

run:
  runs_per_task: 3
  temperature: 0
  seed: 1234
  concurrency_per_model: 4
  max_api_retries: 3
  max_rate_limit_waits: 20       # 429 waits do not count as retries, but are capped
  request_timeout_s: 300
  max_tool_turns: 6
  coding_timeout_s: 10
  circuit_breaker_errors: 8      # stop a model after this many API-error runs in a row

cost_estimate:
  chars_per_token: 4
  image_tokens: 1500             # rough per-image input estimate for vision tasks
  expected_output_fraction: 0.35 # "typical" estimate = this share of max_tokens
  tool_turns_estimate: 3
